<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Community tab glyph: two people with a shared cloud of gas between them.
       Adapted from the supplied mark for the tab bar, which tints the whole
       SVG a single colour (green when active, muted grey when inactive) — so
       the dark background plate is dropped and every shape uses currentColor,
       with opacity carrying the depth that colour used to. -->
  <g transform="translate(100,102)" fill="currentColor">
    <!-- left figure -->
    <circle cx="-68" cy="-38" r="11"/>
    <g fill="none" stroke="currentColor" stroke-width="11"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M-62,-24 L-44,-2"/>
      <path d="M-44,-2 L-54,36"/>
      <path d="M-44,-2 L-34,36"/>
      <path d="M-56,-16 L-68,4"/>
    </g>

    <!-- right figure (slightly recessed, as in the source art) -->
    <g opacity="0.75">
      <circle cx="68" cy="-38" r="11"/>
      <g fill="none" stroke="currentColor" stroke-width="11"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M62,-24 L44,-2"/>
        <path d="M44,-2 L54,36"/>
        <path d="M44,-2 L34,36"/>
        <path d="M56,-16 L68,4"/>
      </g>
    </g>

    <!-- shared gas cloud -->
    <g opacity="0.55">
      <circle cx="-30" cy="2" r="5"/>
      <circle cx="30" cy="2" r="5"/>
      <circle cx="-16" cy="-8" r="10"/>
      <circle cx="16" cy="-8" r="10"/>
      <circle cx="0" cy="-18" r="8"/>
    </g>
    <g opacity="0.8">
      <circle cx="-14" cy="14" r="11"/>
      <circle cx="14" cy="14" r="11"/>
      <circle cx="0" cy="24" r="9"/>
    </g>
    <circle cx="0" cy="2" r="17"/>
    <circle cx="-9" cy="-5" r="9"/>
    <circle cx="9" cy="9" r="9"/>
  </g>
</svg>
